# FEA — rebuild the language pages.
#
# You edit src/pages/*.html (7 files, all four languages inside).
# This robot rebuilds the 28 published files and commits them for you.
#
# Free: GitHub Actions is unlimited on public repositories. Runs in seconds.

name: Build language pages

on:
  push:
    paths:
      - "src/pages/**"
      - "tools/build_pages.py"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only — nothing to install.
      - name: Rebuild the 28 pages
        run: python tools/build_pages.py

      - name: Commit the rebuilt pages
        run: |
          git config user.name  "FEA bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.html'
          if git diff --staged --quiet; then
            echo "Pages already up to date."
          else
            git commit -m "Rebuild language pages"
            git push
          fi
