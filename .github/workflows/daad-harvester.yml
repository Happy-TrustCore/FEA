# FEA — weekly DAAD scholarship harvester.
#
# Free: GitHub Actions is unlimited on public repositories, and this job takes
# well under a minute. No account, no API key — it reads the same public data
# files daad.de already sends to every visitor's browser.
#
# What it does:
#   · fetches DAAD's own scholarship data (isDaad-only, see tools/daad_harvester.py)
#   · compares it against data/daad-state.json (what we already know about)
#   · writes any genuinely new scholarships into src/pages/opportunities.html,
#     using the human-translated sentences in data/sentence-templates.json
#   · opens a Pull Request — nothing is ever pushed straight to main
#
# The maintainer reviews and merges by hand. Merging triggers build-pages.yml,
# which rebuilds the 28 published pages automatically.
#
# Run it by hand any time from the Actions tab ("Run workflow").

name: DAAD scholarship harvester

on:
  schedule:
    # 06:15 UTC every Monday — a different time from the daily link check so
    # the two never race on the same files.
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daad-harvester
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only — nothing to install.
      - name: Look for new DAAD scholarships
        run: python tools/daad_harvester.py

      - name: Add the report to the run summary
        if: always()
        run: |
          if [ -f data/daad-report.md ]; then
            cat data/daad-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check what changed
        id: changes
        run: |
          echo "pages=$(git diff --name-only -- src/pages/opportunities.html | wc -l)" >> "$GITHUB_OUTPUT"
          echo "other=$(git diff --name-only -- . ':!src/pages/opportunities.html' | wc -l)" >> "$GITHUB_OUTPUT"

      # New cards need a human's eyes before they go live — always a Pull
      # Request, never a direct push, no matter how small.
      - name: Open a Pull Request with the new scholarships
        if: steps.changes.outputs.pages != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "DAAD harvester: propose new scholarships"
          title: "New DAAD scholarships — please review"
          body-path: data/daad-report.md
          branch: daad-harvester/new-scholarships
          delete-branch: true
          add-paths: |
            src/pages/opportunities.html
            data/daad-state.json
            data/daad-report.md

      # Bookkeeping only (e.g. the first-run baseline, or the "known" list
      # catching up after a Pull Request was merged) carries no visible
      # change to the site, so it is safe to commit directly — the same way
      # daily-check.yml commits the "last checked" stamp.
      - name: Commit bookkeeping-only changes
        if: steps.changes.outputs.pages == '0' && steps.changes.outputs.other != '0'
        run: |
          git config user.name  "FEA bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daad-state.json data/daad-report.md
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "DAAD harvester: update state (no new scholarships)"
            git push
          fi
